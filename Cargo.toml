[workspace]
resolver = "2"
members = [
    "crates/heard-proto",
    "crates/heard-config",
    "crates/heard-hook",
    "crates/heard-install",
    "crates/heard-narrate",
    "crates/heard-state",
    "crates/heard-tts",
    "crates/heard-cli",
    "crates/heard-daemon",
    "crates/heard-speech",
]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/heardlabs/heard-rust-cli"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
regex = "1"
once_cell = "1"
rustix = { version = "1", default-features = false, features = ["std"] }
# Blocking HTTP with rustls: the Kokoro model download and the ElevenLabs
# backend. No async client needed. `gzip` off (identity encoding).
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# SHA-256 for the pinned model checksums; already in the graph under rustls.
ring = "0.17"
# The daemon's ONE runtime — one async runtime (tokio), not a thread per
# subsystem. Feature-picked rather than "full": the daemon
# needs an accept loop, per-session tasks, timers and channels, and nothing
# else. No `fs` (the ported crates do blocking file I/O behind flocks), no
# `process`, no `signal`.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
