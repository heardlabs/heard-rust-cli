name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "3"
  # Tests never need provider keys; make sure none leak in.
  ANTHROPIC_API_KEY: ""
  ELEVENLABS_API_KEY: ""

jobs:
  rust:
    name: fmt · clippy · test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked --no-fail-fast

  shell:
    name: shellcheck · install.sh
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: command -v shellcheck || brew install shellcheck
      - name: shellcheck
        run: shellcheck install.sh packaging/*.sh tests/*.sh
      - name: install.sh end to end (temp HOME, fake releases)
        run: sh tests/install_sh.sh
